---
controls:
version: "eks-2.0.0"
id: 2
text: "Control Plane Configuration"
type: "controlplane"
groups:
  - id: 2.1
    text: "Logging"
    checks:
      - id: 2.1.1
        text: "Enable EKS control plane logging (Automated)"
        remediation: |
          From Console:
          1. For each EKS Cluster in each Region.
          2. Go to Amazon Elastic Kubernetes Service > Clusters > CLUSTER_NAME > Observability > Control plane logs.
          3. Click **Manage** to enable or disable logging.
          4. Ensure that the required control plane log types are enabled:
            - API server
            - Audit
            - Authenticator
            - Controller manager
            - Scheduler
          5. Save the changes.
          From AWS CLI:
          aws eks update-cluster-config \
            --name $CLUSTER_NAME \
            --region $REGION_CODE \
            --logging '{"clusterLogging":[{"types":["api","audit","authenticator","controllerManager","scheduler"],"enabled":true}]}'
        scored: false
