---
controls:
version: "eks-2.0.0"
id: 3
text: "Worker Nodes"
type: "node"
groups:
  - id: 3.1
    text: "Worker Node Configuration Files"
    checks:
      - id: 3.1.1
        text: "Ensure that the kubeconfig file permissions are set to 644 or more restrictive (Automated)"
        audit: '/bin/sh -c ''if test -e $kubeletkubeconfig; then stat -c permissions=%a $kubeletkubeconfig; fi'' '
        tests:
          test_items:
            - flag: "permissions"
              compare:
                op: bitmask
                value: "644"
        remediation: |
          Run the below command (based on the file location on your system) on the each worker node.
          For example,
          chmod 644 $kubeletkubeconfig
        scored: true

      - id: 3.1.2
        text: "Ensure that the kubeconfig file ownership is set to root:root (Automated)"
        audit: '/bin/sh -c ''if test -e $kubeletkubeconfig; then stat -c %U:%G $kubeletkubeconfig; fi'' '
        tests:
          test_items:
            - flag: root:root
        remediation: |
          Run the below command (based on the file location on your system) on the each worker node.
          For example,
          chown root:root $kubeletkubeconfig
        scored: true

      - id: 3.1.3
        text: "Ensure that the kubelet configuration file has permissions set to 644 or more restrictive (Automated)"
        audit: '/bin/sh -c ''if test -e $kubeletconf; then stat -c permissions=%a $kubeletconf; fi'' '
        tests:
          test_items:
            - flag: "permissions"
              compare:
                op: bitmask
                value: "644"
        remediation: |
          Run the following command (using the config file location identified in the Audit step)
          chmod 644 $kubeletconf
        scored: true

      - id: 3.1.4
        text: "Ensure that the kubelet configuration file ownership is set to root:root (Automated)"
        audit: '/bin/sh -c ''if test -e $kubeletconf; then stat -c %U:%G $kubeletconf; fi'' '
        tests:
          test_items:
            - flag: root:root
        remediation: |
          Run the following command (using the config file location identified in the Audit step)
          chown root:root $kubeletconf
        scored: true

  - id: 3.2
    text: "Kubelet"
    checks:
      - id: 3.2.1
        text: "Ensure kubelet anonymous authentication is disabled (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          test_items:
            - path: '{.kubeletconfig.authentication.anonymous.enabled}'
              compare:
                op: eq
                value: "false"
        remediation: |
          If the audit returns true, the worker node is allowing anonymous requests to the kubelet
          and should be treated as noncompliant.
          Remediation of new cluster:
          - Define authentication.anonymous.enabled: false in the worker node bootstrap
            configuration.
          - Use a custom launch template when kubelet customization is required.
          - Configure the setting through launch template user data or NodeConfig.
          - Validate the effective kubelet configuration after deployment.
          Remediation of existing running cluster:
          - Update the launch template or node bootstrap configuration so
            authentication.anonymous.enabled is false.
          - Apply the updated launch template to the managed node group.
          - Replace or roll existing worker nodes.
          - Re-audit the replacement nodes to verify the effective value is false.
        scored: true

      - id: 3.2.2
        text: "Ensure kubelet authorization mode is set to Webhook (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          test_items:
            - path: "{.kubeletconfig.authorization.mode}"
              compare:
                op: eq
                value: "Webhook"
        remediation: |
          For new clusters:
            - Define authorization.mode: Webhook in the worker node bootstrap configuration.
            - Use a custom launch template when kubelet customization is required.
            - Validate the effective kubelet configuration after node creation.

          For existing clusters:
            - Update the launch template or bootstrap configuration so authorization.mode is Webhook.
            - Update the managed node group to use the new launch template.
            - Replace existing worker nodes.
            - Verify the effective kubelet configuration after node replacement.
        scored: true

      - id: 3.2.3
        text: "Ensure the kubelet X.509 client CA file is configured (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          test_items:
            - path: "{.kubeletconfig.authentication.x509.clientCAFile}"
              set: true
        remediation: |
          For new clusters:
            - Select and manage the CA used for kubelet client certificate authentication.
            - Use a custom launch template when kubelet authentication customization is required.
            - Use a custom AMI or equivalent bootstrap customization to place the CA bundle on the worker node and configure kubelet to reference it.
            - Validate after deployment that the kubelet is configured with the expected client CA file.

          For existing clusters:
            - Update the launch template or custom AMI to include the required client CA bundle.
            - Update the managed node group to use the new launch template version.
            - Replace existing worker nodes so the updated kubelet configuration is applied.
            - Verify the effective kubelet configuration after node replacement.

          Note:
          Do not modify the kubelet configuration directly on worker nodes. Configure the client CA file through the supported EKS bootstrap and launch template workflow so the configuration persists across node replacement.
        scored: true

      - id: 3.2.4
        text: "Ensure the kubelet read-only port is disabled (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          bin_op: or
          test_items:
            - path: "{.kubeletconfig.readOnlyPort}"
              set: false
            - path: "{.kubeletconfig.readOnlyPort}"
              compare:
                op: regex
                value: "^(0|null|<nil>)$"
        remediation: |
          For new clusters:
            - Configure the kubelet with readOnlyPort: 0.
            - Use a custom launch template when kubelet customization is required.
            - Apply the setting through the supported bootstrap configuration (launch template user data, NodeConfig, or custom AMI).
            - Verify after deployment that the effective kubelet configuration reports readOnlyPort as 0.

          For existing clusters:
            - Update the launch template or bootstrap configuration so readOnlyPort is set to 0.
            - Apply the updated launch template version to the managed node group.
            - Replace existing worker nodes so the updated configuration is applied.
            - Verify the effective kubelet configuration after node replacement.

          Note:
          Do not modify the kubelet configuration directly on worker nodes. Configure the setting through the supported EKS bootstrap and launch template workflow so it persists across node replacement.
        scored: true

      - id: 3.2.5
        text: "Ensure the kubelet iptables utility chains are enabled (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          test_items:
            - path: '{.kubeletconfig.makeIPTablesUtilChains}'
              set: true
              compare:
                op: eq
                value: "true"
        remediation: |
          For new EKS clusters:
          - Configure the kubelet bootstrap configuration so:
              makeIPTablesUtilChains: true
          - Use a custom launch template when kubelet customization is required.
          - Place the setting in the supported bootstrap path (Launch Template user data,
            NodeConfig, or custom AMI).
          - Verify the effective kubelet configuration after the node joins the cluster.

          For existing EKS clusters:
          - Update the custom launch template or node bootstrap configuration so:
              makeIPTablesUtilChains: true
          - Apply the updated launch template version to the managed node group.
          - Replace or roll the existing worker nodes so the updated configuration is applied.
          - Re-audit the replacement nodes to verify the effective configuration.

          Note:
          Do not edit the kubelet configuration directly on EKS worker nodes.
          Apply the configuration through the supported EKS bootstrap and launch template workflow.
        scored: true

      - id: 3.2.6
        text: "Ensure the kubelet event recording QPS is set to an appropriate value (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          test_items:
            - path: '{.kubeletconfig.eventRecordQPS}'
              set: true
              compare:
                op: gt
                value: "0"
        remediation: |
          For new EKS clusters:
          - Configure the kubelet bootstrap configuration with an appropriate
            eventRecordQPS value.
          - Use the Kubernetes default value of 50 unless operational requirements
            justify another bounded value.
          - Avoid setting eventRecordQPS to 0, as this disables rate limiting.
          - Apply the configuration through a custom launch template or other
            supported EKS bootstrap configuration.
          - Verify the effective kubelet configuration after deployment.

          For existing EKS clusters:
          - Update the launch template or node bootstrap configuration with the
            desired eventRecordQPS value.
          - Apply the updated launch template version to the managed node group.
          - Replace or roll the worker nodes so the new configuration is applied.
          - Re-audit the replacement nodes to confirm the effective configuration.

          Note:
          Do not edit the kubelet configuration directly on EKS worker nodes.
          Apply configuration changes through the supported EKS bootstrap and
          launch template workflow.
        scored: true

      - id: 3.2.7
        text: "Ensure the kubelet client certificate rotation is enabled (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          bin_op: or
          test_items:
            - path: '{.kubeletconfig.rotateCertificates}'
              set: true
              compare:
                op: regex
                value: "^(true|null|<nil>)$"
            - path: '{.kubeletconfig.featureGates.RotateKubeletServerCertificate}'
              compare:
                op: eq
                value: "true"
        remediation: |
          For new EKS clusters:
          - Configure the worker node kubelet with:
              rotateCertificates: true
          - Apply the setting through a custom launch template or other supported
            EKS bootstrap configuration.
          - Verify the effective kubelet configuration after deployment.

          For existing EKS clusters:
          - Update the launch template or node bootstrap configuration so:
              rotateCertificates: true
          - Apply the updated launch template version to the managed node group.
          - Replace or roll the existing worker nodes so the updated configuration
            is applied.
          - Re-audit the replacement nodes to verify the effective configuration.

          Note:
          Do not edit the kubelet configuration directly on EKS worker nodes.
          Apply configuration changes through the supported EKS bootstrap and
          launch template workflow.
        scored: true

      - id: 3.2.8
        text: "Ensure serverTLSBootstrap and RotateKubeletServerCertificate are enabled (Automated)"
        audit_config: |
          NODE_NAME=${NODE_NAME:-$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')}
          kubectl get --raw /api/v1/nodes/${NODE_NAME}/proxy/configz
        tests:
          test_items:
            - path: '{.kubeletconfig.serverTLSBootstrap}'
              set: true
              compare:
                op: eq
                value: "true"

            - path: '{.kubeletconfig.featureGates.RotateKubeletServerCertificate}'
              set: true
              compare:
                op: eq
                value: "true"
          bin_op: and
        scored: true
