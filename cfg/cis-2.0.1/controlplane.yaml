---
controls:
version: "cis-2.0.1"
id: 3
text: "Control Plane Configuration"
type: "controlplane"
groups:
  - id: 3.1
    text: "Authentication and Authorization"
    checks:
      - id: 3.1.1
        text: 'Client certificate authentication should not be used for users (Manual)'
        type: "manual"
        impact: "External mechanisms for authentication generally require additional software to be deployed."
        remediation: |
          Alternative mechanisms provided by Kubernetes such as the use of OIDC should be implemented in place of client certificates.
        scored: false

      - id: 3.1.2
        text: 'Service account token authentication should not be used for users (Manual)'
        type: "manual"
        impact: "External mechanisms for authentication generally require additional software to be deployed."
        remediation: |
          Alternative mechanisms provided by Kubernetes such as the use of OIDC should be implemented in place of service account tokens.
        scored: false

      - id: 3.1.3
        text: 'Bootstrap token authentication should not be used for users (Manual)'
        type: "manual"
        impact: "External mechanisms for authentication generally require additional software to be deployed."
        remediation: |
          Alternative mechanisms provided by Kubernetes such as the use of OIDC should be implemented in place of bootstrap tokens.
        scored: false

  - id: 3.2
    text: "Logging"
    checks:
      - id: 3.2.1
        text: 'Ensure that a minimal audit policy is created (Manual)'
        audit: |
          ps -ef | grep kube-apiserver
        tests:
          test_items:
            - flag: "--audit-policy-file"
              set: true
        impact: "Audit logs will be created on the master nodes, which will consume disk space. Care should be taken to avoid generating too large volumes of log information as this could impact the available of the cluster nodes."
        remediation: |
          Create an audit policy file for your cluster.
        scored: false

      - id: 3.2.2
        text: 'Ensure that the audit policy covers key security concerns (Manual)'
        type: "manual"
        impact: "Increasing audit logging will consume resources on the nodes or other log destination."
        remediation: |
          Consider modification of the audit policy in use on the cluster to include these items, at a minimum.
        scored: false
